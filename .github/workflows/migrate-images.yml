name: Migrate Vercel Blob images

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate images to Cloudinary
        env:
          APP_URL: ${{ secrets.APP_URL }}
          MIGRATION_SECRET: ${{ secrets.MIGRATION_SECRET }}
        run: |
          set -e

          echo "Calling migration endpoint..."
          echo "APP_URL is configured: $([ -n "$APP_URL" ] && echo yes || echo no)"

          response=$(curl -sS \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $MIGRATION_SECRET" \
            "$APP_URL/api/migrate-images")

          echo "Server response:"
          echo "$response"

          body=$(printf '%s\n' "$response" | sed '$d')
          status=$(printf '%s\n' "$response" | tail -n 1 | sed 's/HTTP_STATUS://')

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Migration endpoint returned HTTP $status"
            exit 1
          fi

          if ! echo "$body" | jq -e . >/dev/null; then
            echo "The endpoint did not return valid JSON."
            exit 1
          fi

          failed=$(echo "$body" | jq -r '.failed')
          remaining=$(echo "$body" | jq -r '.remaining')

          if [ "$failed" -gt 0 ] || [ "$remaining" -gt 0 ]; then
            echo "Some images still need migration."
            exit 1
          fi
